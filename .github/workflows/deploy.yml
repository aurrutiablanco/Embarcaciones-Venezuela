name: Deploy to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Execute remote SSH deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/ev4.antoniomarcoweb.com/public_html

            # 1. Tomar propiedad temporal garantizando el usuario actual
            sudo chown -R $(whoami):$(whoami) .

            # 2. Aplicar configuracion segura de Git SIN sudo (para tu usuario)
            git config --global --add safe.directory /var/www/ev4.antoniomarcoweb.com/public_html

            # 3. Forzar sincronizacion exacta
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            git lfs pull

            # 4. Restaurar permisos estrictos de seguridad para Apache
            sudo chown -R www-data:www-data .
            sudo chmod -R 775 .

            # 5. Recargar servidor
            sudo systemctl reload apache2