<section
  class="hero-carousel"
  aria-label="Experiencias Náuticas VIP en Morrocoy"
>
  <div class="video-container">
    <video
      id="hero-video"
      autoplay
      muted
      loop
      playsinline
      aria-hidden="true"
      tabindex="-1"
    >
      <source id="video-source" src="videos/DJI_0134.MP4" type="video/mp4" />
    </video>
    <div class="video-overlay" aria-hidden="true"></div>
  </div>

  <div class="hero-content">
    <h1 class="hero-title">Diseñamos experiencias náuticas VIP</h1>
    <p class="hero-subtitle">
      Alquiler y gestión exclusiva de yates y embarcaciones de lujo en las
      mejores costas
    </p>
    <div class="cta-group">
      <a href="#flota" class="btn btn-primary">Explorar flota</a>
      <a
        href="https://wa.me/584120000000"
        class="btn btn-secondary"
        target="_blank"
        rel="noopener noreferrer"
        >Reservar asesoría</a
      >
    </div>
  </div>

  <div class="carousel-controls">
    <button
      id="toggle-autoplay"
      class="btn-control btn-pause"
      aria-label="Pausar rotación automática"
      aria-pressed="false"
    >
      <svg
        class="icon-pause"
        aria-hidden="true"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <rect x="6" y="4" width="4" height="16" rx="1" />
        <rect x="14" y="4" width="4" height="16" rx="1" />
      </svg>
      <svg
        class="icon-play"
        aria-hidden="true"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="currentColor"
        style="display: none"
      >
        <polygon points="5,3 19,12 5,21" />
      </svg>
    </button>

    <div
      class="tabs-wrapper"
      role="tablist"
      aria-label="Diapositivas de video náutico"
    >
      <button
        role="tab"
        id="tab-0"
        class="tab-indicator active"
        aria-selected="true"
        aria-controls="hero-video"
        aria-label="Video 1 de 3: Yate VIP"
        data-index="0"
      >
        <span class="progress-bar"><span class="progress-fill"></span></span>
      </button>
      <button
        role="tab"
        id="tab-1"
        class="tab-indicator"
        aria-selected="false"
        aria-controls="hero-video"
        aria-label="Video 2 de 3: Lancha deportiva"
        data-index="1"
      >
        <span class="progress-bar"><span class="progress-fill"></span></span>
      </button>
      <button
        role="tab"
        id="tab-2"
        class="tab-indicator"
        aria-selected="false"
        aria-controls="hero-video"
        aria-label="Video 3 de 3: Peñero ejecutivo"
        data-index="2"
      >
        <span class="progress-bar"><span class="progress-fill"></span></span>
      </button>
    </div>
  </div>

  <div
    id="sr-announcer"
    class="sr-only"
    aria-live="polite"
    aria-atomic="true"
  ></div>
</section>
